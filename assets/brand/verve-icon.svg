<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0B0E14"/>
  <defs>
    <pattern id="hatch-icon" width="8" height="8"
             patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8"
            stroke="#5D3742" stroke-width="1.4"/>
    </pattern>
    <clipPath id="clip-icon"><polygon points="18,18 37,18 50,56 63,18 82,18 50,82"/></clipPath>
  </defs>
  <g clip-path="url(#clip-icon)">
    <polygon points="18,18 37,18 50,56 63,18 82,18 50,82" fill="#C2687A"/>
    <rect x="0" y="0" width="100" height="100" fill="url(#hatch-icon)"/>
  </g>
</svg>
