<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <defs>
    <pattern id="hatch-adaptive" width="8" height="8"
             patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8"
            stroke="#5D3742" stroke-width="1.4"/>
    </pattern>
    <clipPath id="clip-adaptive"><polygon points="27,27 40.6,27 50,54.3 59.4,27 73,27 50,73"/></clipPath>
  </defs>
  <g clip-path="url(#clip-adaptive)">
    <polygon points="27,27 40.6,27 50,54.3 59.4,27 73,27 50,73" fill="#C2687A"/>
    <rect x="0" y="0" width="100" height="100" fill="url(#hatch-adaptive)"/>
  </g>
</svg>
